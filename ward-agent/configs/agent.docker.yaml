listen: ":8080"
admin_listen: "127.0.0.1:9090"
data_dir: "/data"

panel:
  url: "http://panel:8000"
  token: "${WARD_AGENT_TOKEN}"
  tls_skip_verify: true
  timeout: 10s
  heartbeat_every: 15s
  require_signed_policy: false
  policy_public_key: ""

waf:
  mode: detection_only
  request_body_limit: 13107200
  request_body_timeout: 10s

queue:
  path: "/data/events.jsonl"
  max_bytes: 104857600
  max_age: 24h
  max_attempts: 8

tls:
  cert_file: ""
  key_file: ""

trusted_proxies: []

sites:
  - hostname: "localhost"
    origin_url: "http://origin"
    id: 1
